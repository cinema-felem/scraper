[project]
name = "cinema-scraper-etl"
version = "1.0.0"
description = "Python ETL pipeline for Singapore cinema data"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2"]

[project.optional-dependencies]
dev = ["bandit>=1.7", "mypy>=1.10", "ruff>=0.5"]

[project.scripts]
pyetl = "pyetl.__main__:main"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101", "S310"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true
